[package]
name = "protein"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
# -- Base API Requirement
rocket = { version = "0.5.1", features = ["json", "uuid"] }
# -- Diesel Requirements (Database)
diesel = { version = "2.2.6", features = ["postgres", "uuid", "chrono"] }
diesel-async = { version = "0.5.2", features = [
    "postgres",
    "deadpool",
    "async-connection-wrapper",
] }
diesel_migrations = { version = "2.2.0" }
## -- Async
tokio = { version = "1.42.0", features = ["rt"] }
# -- Requests
reqwest = { version = "0.12", features = ["json"] }
# -- Serialization
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.134", optional = true }
uuid = { version = "1.11.0", features = ["fast-rng"] }
chrono = { version = "0.4.39", features = ["serde"] }
# -- .env
dotenvy = "0.15"
# -- Extras
futures-util = "0.3.21"
# -- Tracing
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-appender = "0.2.3"
tracing-log = "0.2.0"
# -- Redis
fred = { version = "10.0.3", features = ["serde-json", "i-keys"] }
## -- Shadow and SysInfo
shadow-rs = { version = "0.37.0", features = ["metadata"] }
sysinfo = "0.33.1"

[build-dependencies]
shadow-rs = { version = "0.37.0", features = ["metadata"] }

[package.metadata.cargo-udeps.ignore]
normal = [
    "reqwest",
]
