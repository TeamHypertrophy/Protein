[profile.dev]
opt-level = 1
codegen-backend = "cranelift"
incremental = true
rustflags = ["-Zthreads=8"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"]

[build]
rustflags = ["-C", "target-cpu=native"]

[profile.dev.package."*"]
opt-level = 3
codegen-backend = "llvm"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld", "-Zshare-generics=y"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[unstable]
codegen-backend = true

[registries]
crates-io = { protocol = "sparse" }
